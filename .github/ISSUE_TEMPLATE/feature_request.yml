name: Feature request
description: 提议一个新功能或行为改进
title: "[Feature]: "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过已有 Issue 和功能请求。
          required: true
        - label: 我描述的是实际问题，而不是只描述一个实现想法。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁遇到了什么问题？当前有什么限制？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的解决方案
      description: 请描述期望的用户行为和结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 请说明已经考虑过的替代方案或临时做法。
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 请说明对性能、存储、隐私、兼容性和界面的影响。
    validations:
      required: false
