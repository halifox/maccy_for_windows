name: Windows CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request and commit subjects
        uses: actions/github-script@v9
        with:
          script: |
            const allowedTypes = new Set([
              'feat', 'fix', 'docs', 'ci', 'chore', 'build', 'test',
              'refactor', 'style', 'perf'
            ]);
            const headerPattern = /^([a-z][a-z0-9-]*)(?:\(([A-Za-z0-9][A-Za-z0-9._/-]*)\))?(!)?: .+$/;
            const pullRequest = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100
            });
            const messages = [
              ['PR title', pullRequest.title],
              ...commits
                .filter(commit => commit.parents.length === 1)
                .map(commit => [
                  `commit ${commit.sha.slice(0, 7)}`,
                  commit.commit.message.split(/\r?\n/, 1)[0]
                ])
            ];

            const errors = [];
            for (const [source, header] of messages) {
              const match = header.match(headerPattern);
              if (!match || !allowedTypes.has(match[1])) {
                errors.push(`${source} must use an allowed Conventional Commit header: ${header}`);
              }
            }
            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
