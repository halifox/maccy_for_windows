name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', "build/${{ matrix.configuration }}-vcpkg",
            '-G', 'Visual Studio 18 2026',
            '-A', 'x64',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static-md'
          )
          if ($env:GITHUB_REF_NAME -match '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $cmakeArgs += "-DMACCY_VERSION=$($Matches[1])"
          }
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build "build/${{ matrix.configuration }}-vcpkg" --config "${{ matrix.configuration }}" --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "build/${{ matrix.configuration }}-vcpkg" -C "${{ matrix.configuration }}" --output-on-failure

      - name: Install staging tree
        shell: pwsh
        run: cmake --install "build/${{ matrix.configuration }}-vcpkg" --config "${{ matrix.configuration }}" --prefix "build/${{ matrix.configuration }}-vcpkg/install"

      - name: Package and verify Release metadata
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          cpack --config "build/Release-vcpkg/CPackConfig.cmake" -C Release -G ZIP
          $archive = Get-ChildItem -LiteralPath . -Filter 'maccy-*.zip' -File | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'CPack did not produce a ZIP archive.'
          }
          $extract = Join-Path $env:RUNNER_TEMP 'maccy-package'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          $required = @(
            'LICENSE',
            'README.md',
            'SECURITY.md',
            'PRIVACY.md',
            'CONTRIBUTING.md',
            'CODE_OF_CONDUCT.md',
            'CHANGELOG.md',
            'RELEASE_CHECKLIST.md',
            'THIRD_PARTY_NOTICES/README.md',
            'THIRD_PARTY_NOTICES/Maccy-LICENSE.txt',
            'licenses/cpr/copyright',
            'licenses/curl/copyright',
            'licenses/nlohmann-json/copyright',
            'licenses/wtl/copyright',
            'licenses/sqlite3/copyright',
            'licenses/zlib/copyright'
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root.FullName $relativePath))) {
              throw "Package is missing $relativePath"
            }
          }

      - name: Upload staging tree
        uses: actions/upload-artifact@v4
        with:
          name: maccy-${{ matrix.configuration }}-x64
          path: build/${{ matrix.configuration }}-vcpkg/install
          if-no-files-found: error
