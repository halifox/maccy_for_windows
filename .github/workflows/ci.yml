name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request and commit subjects
        uses: actions/github-script@v9
        with:
          script: |
            const allowedTypes = new Set([
              'feat', 'fix', 'docs', 'ci', 'chore', 'build', 'test',
              'refactor', 'style', 'perf'
            ]);
            const headerPattern = /^([a-z][a-z0-9-]*)(?:\(([A-Za-z0-9][A-Za-z0-9._/-]*)\))?(!)?: .+$/;
            const pullRequest = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100
            });
            const messages = [
              ['PR title', pullRequest.title],
              ...commits.map(commit => [
                `commit ${commit.sha.slice(0, 7)}`,
                commit.commit.message.split(/\r?\n/, 1)[0]
              ])
            ];

            const errors = [];
            for (const [source, header] of messages) {
              const match = header.match(headerPattern);
              if (!match || !allowedTypes.has(match[1])) {
                errors.push(`${source} must use an allowed Conventional Commit header: ${header}`);
              }
            }
            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }

  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        platform:
          - arch: x64
            vs_platform: x64
            triplet: x64-windows-static-md
          - arch: x86
            vs_platform: Win32
            triplet: x86-windows-static-md

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', "build/${{ matrix.configuration }}-vcpkg",
            '-G', 'Visual Studio 18 2026',
            '-A', '${{ matrix.platform.vs_platform }}',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.platform.triplet }}'
          )
          if ($env:GITHUB_REF_NAME -match '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $cmakeArgs += "-DMACCY_VERSION=$($Matches[1])"
          }
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build "build/${{ matrix.configuration }}-vcpkg" --config "${{ matrix.configuration }}" --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "build/${{ matrix.configuration }}-vcpkg" -C "${{ matrix.configuration }}" --output-on-failure

      - name: Install staging tree
        shell: pwsh
        run: cmake --install "build/${{ matrix.configuration }}-vcpkg" --config "${{ matrix.configuration }}" --prefix "build/${{ matrix.configuration }}-vcpkg/install"

      - name: Verify Release staging metadata
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath 'build/Release-vcpkg/install').Path
          $required = @(
            'bin/maccy.exe',
            'LICENSE',
            'README.md',
            'SECURITY.md',
            'PRIVACY.md',
            'CONTRIBUTING.md',
            'CODE_OF_CONDUCT.md',
            'CHANGELOG.md',
            'THIRD_PARTY_NOTICES/README.md',
            'THIRD_PARTY_NOTICES/Maccy-LICENSE.txt',
            'licenses/cpr/copyright',
            'licenses/curl/copyright',
            'licenses/nlohmann-json/copyright',
            'licenses/wtl/copyright',
            'licenses/sqlite3/copyright',
            'licenses/zlib/copyright'
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relativePath))) {
              throw "Release staging tree is missing $relativePath"
            }
          }

      - name: Upload staging tree
        uses: actions/upload-artifact@v7
        with:
          name: maccy-${{ matrix.configuration }}-${{ matrix.platform.arch }}
          path: build/${{ matrix.configuration }}-vcpkg/install
          if-no-files-found: error
