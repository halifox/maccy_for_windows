name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', "build/${{ matrix.configuration }}-vcpkg",
            '-G', 'Visual Studio 18 2026',
            '-A', 'x64',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static-md'
          )
          if ($env:GITHUB_REF_NAME -match '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $cmakeArgs += "-DMACCY_VERSION=$($Matches[1])"
          }
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build "build/${{ matrix.configuration }}-vcpkg" --config "${{ matrix.configuration }}" --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "build/${{ matrix.configuration }}-vcpkg" -C "${{ matrix.configuration }}" --output-on-failure

      - name: Install staging tree
        shell: pwsh
        run: cmake --install "build/${{ matrix.configuration }}-vcpkg" --config "${{ matrix.configuration }}" --prefix "build/${{ matrix.configuration }}-vcpkg/install"

      - name: Verify Release staging metadata
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath 'build/Release-vcpkg/install').Path
          $required = @(
            'bin/maccy.exe',
            'LICENSE',
            'README.md',
            'SECURITY.md',
            'PRIVACY.md',
            'CONTRIBUTING.md',
            'CODE_OF_CONDUCT.md',
            'CHANGELOG.md',
            'THIRD_PARTY_NOTICES/README.md',
            'THIRD_PARTY_NOTICES/Maccy-LICENSE.txt',
            'licenses/cpr/copyright',
            'licenses/curl/copyright',
            'licenses/nlohmann-json/copyright',
            'licenses/wtl/copyright',
            'licenses/sqlite3/copyright',
            'licenses/zlib/copyright'
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relativePath))) {
              throw "Release staging tree is missing $relativePath"
            }
          }

      - name: Upload staging tree
        uses: actions/upload-artifact@v7
        with:
          name: maccy-${{ matrix.configuration }}-x64
          path: build/${{ matrix.configuration }}-vcpkg/install
          if-no-files-found: error
