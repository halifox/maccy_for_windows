name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag (leave empty to build only)
        required: false
        type: string

  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest
    env:
      MACCY_RELEASE_TAG: ${{ inputs.release_tag }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-md-vs2026-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md-vs2026-

      - name: Configure Release
        run: >-
          cmake -S . -B build/Release-vcpkg -G "Visual Studio 18 2026" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DMACCY_REQUIRE_BUNDLED_MSVC_RUNTIME=ON

      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build Release
        run: cmake --build build/Release-vcpkg --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build/Release-vcpkg -C Release --output-on-failure

      - name: Create NSIS installer
        run: cpack --config build/Release-vcpkg/CPackConfig.cmake -C Release -G NSIS

      - name: Create checksums
        run: |
          Get-FileHash -Path 'MaccyForWindows-*-x64.exe' -Algorithm SHA256 -ErrorAction Stop |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path SHA256SUMS.txt -Encoding utf8

      - name: Upload installer and checksums
        uses: actions/upload-artifact@v7
        with:
          name: maccy-windows-x64
          path: |
            MaccyForWindows-*-x64.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload assets to the existing draft Release and publish it
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isDraft = gh release view "$env:MACCY_RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') {
            throw "Expected an existing draft Release for tag '$env:MACCY_RELEASE_TAG'."
          }
          $assets = @((Get-Item 'MaccyForWindows-*-x64.exe' -ErrorAction Stop).FullName) + 'SHA256SUMS.txt'
          gh release upload "$env:MACCY_RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:MACCY_RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false
