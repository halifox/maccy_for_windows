name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must use the vX.Y.Z format."
          }
          $tagVersion = $Matches[1]
          $versionFileValue = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($versionFileValue -ne $tagVersion) {
            throw "Tag version $tagVersion does not match version.txt ($versionFileValue)."
          }
          "Release version: $tagVersion"
          "MACCY_RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Configure Release
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build/Release-vcpkg',
            '-G', 'Visual Studio 18 2026',
            '-A', 'x64',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static-md',
            "-DMACCY_VERSION=$env:MACCY_RELEASE_VERSION",
            '-DMACCY_REQUIRE_BUNDLED_MSVC_RUNTIME=ON'
          )
          cmake @cmakeArgs

      - name: Build Release
        shell: pwsh
        run: cmake --build build/Release-vcpkg --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/Release-vcpkg -C Release --output-on-failure

      - name: Create NSIS installer
        shell: pwsh
        run: |
          cpack --config build/Release-vcpkg/CPackConfig.cmake -C Release -G NSIS

      - name: Create checksums
        shell: pwsh
        run: |
          $installerName = "MaccyForWindows-$env:MACCY_RELEASE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath $installerName -ErrorAction SilentlyContinue
          if ($null -eq $installer) {
            throw "Expected NSIS installer '$installerName' was not produced."
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @("$hash  $($installer.Name)")
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'SHA256SUMS.txt'), $lines)

      - name: Upload assets to the existing draft Release and publish it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseEndpoint = "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME"
          $releaseResponse = gh api $releaseEndpoint
          if ($LASTEXITCODE -ne 0) {
            throw "Release Please did not create a Release for tag '$env:GITHUB_REF_NAME'."
          }
          $release = $releaseResponse | ConvertFrom-Json
          if ($release.tag_name -ne $env:GITHUB_REF_NAME -or -not $release.draft) {
            throw "Expected an existing draft Release for tag '$env:GITHUB_REF_NAME'."
          }

          $installerName = "MaccyForWindows-$env:MACCY_RELEASE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath $installerName -ErrorAction SilentlyContinue
          if ($null -eq $installer) {
            throw "Expected installer '$installerName' is missing."
          }
          $assets = @($installer.FullName, (Join-Path (Get-Location) 'SHA256SUMS.txt'))
          gh release upload "$env:GITHUB_REF_NAME" $assets --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Uploading the installer and SHA-256 file failed; the Release remains a draft.'
          }

          $publishedReleaseResponse = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not verify uploaded Release assets; the Release remains a draft.'
          }
          $publishedRelease = $publishedReleaseResponse | ConvertFrom-Json
          $uploadedNames = @($publishedRelease.assets | ForEach-Object { $_.name })
          foreach ($requiredName in @($installerName, 'SHA256SUMS.txt')) {
            if ($uploadedNames -notcontains $requiredName) {
              throw "Release asset '$requiredName' is missing; the Release remains a draft."
            }
          }

          gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" --method PATCH --field draft=false | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'Publishing the Release failed; it remains a draft.'
          }
