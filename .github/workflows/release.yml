name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must use the vX.Y.Z format."
          }
          $tagVersion = $Matches[1]
          "Release version: $tagVersion"
          "MACCY_RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Configure Release
        shell: pwsh
        run: cmake -S . -B build/Release -G "Visual Studio 18 2026" -A x64 -DMACCY_VERSION="$env:MACCY_RELEASE_VERSION"

      - name: Build Release
        shell: pwsh
        run: cmake --build build/Release --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/Release -C Release --output-on-failure

      - name: Create ZIP and NSIS packages
        shell: pwsh
        run: |
          cpack --config build/Release/CPackConfig.cmake -C Release -G ZIP
          cpack --config build/Release/CPackConfig.cmake -C Release -G NSIS

      - name: Create checksums
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath . -File | Where-Object { $_.Name -like 'maccy-*' -and $_.Extension -in @('.zip', '.exe') })
          if ($assets.Count -lt 2) {
            throw 'Expected ZIP and NSIS assets were not produced.'
          }
          $lines = foreach ($asset in $assets | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'SHA256SUMS.txt'), $lines)

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --generate-notes
          $assets = @(
            (Get-ChildItem -LiteralPath . -File | Where-Object { $_.Name -like 'maccy-*' -and $_.Extension -in @('.zip', '.exe') }).FullName
            (Join-Path (Get-Location) 'SHA256SUMS.txt')
          )
          gh release upload "$env:GITHUB_REF_NAME" $assets --repo "$env:GITHUB_REPOSITORY" --clobber
